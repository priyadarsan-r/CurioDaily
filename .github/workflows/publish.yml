name: Publish Scheduled Content

on:
  schedule:
    # Exact slots from config/schedule.yml (IST to UTC):
    # 09:00 IST = 03:30 UTC (Reel: Money Secrets)
    # 11:00 IST = 05:30 UTC (Feed Post 1)
    # 12:30 IST = 07:00 UTC (Reel: Human Psychology)
    # 15:00 IST = 09:30 UTC (Carousel)
    # 17:00 IST = 11:30 UTC (Reel: Future Is Here)
    # 18:30 IST = 13:00 UTC (Feed Post 2)
    # 20:30 IST = 15:00 UTC (Reel: The Daily Mystery)
    - cron: '30 3,5,9,11 * * *'
    - cron: '0 7,13,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Publishing Queue
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python publishing/publish_queue.py

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-engine-db
          path: database/content_engine.db
          retention-days: 7
