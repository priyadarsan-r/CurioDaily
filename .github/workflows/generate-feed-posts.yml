name: Generate Feed Posts

on:
  schedule:
    # 04:30 UTC = 10:00 IST (Preparation for 11:00 IST slot)
    # 12:00 UTC = 17:30 IST (Preparation for 18:30 IST slot)
    - cron: '30 4,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Single Image Feed Posts
        run: |
          python scripts/run_daily.py --stage generate --format image

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-posts-output
          path: output/
          retention-days: 3
