name: Topic Discovery

on:
  schedule:
    # 02:00 UTC = 07:30 IST
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Topic Discovery
        run: |
          python discovery/collect.py

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-engine-db
          path: database/content_engine.db
          retention-days: 7
